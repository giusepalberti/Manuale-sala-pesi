<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Manuale Sala" />
  <meta name="theme-color" content="#0A0A0C" />
  <title>Manuale Sala Pesi</title>
  <style>
    :root {
      --bg: #0A0A0C;
      --surface: #141418;
      --surface-2: #1E1E24;
      --border: #2A2A32;
      --text: #F5F5F7;
      --text-muted: #9898A6;
      --accent: #FF4D2D;
      --accent-soft: rgba(255, 77, 45, 0.14);
      --amber: #FF9F1C;
      --amber-soft: rgba(255, 159, 28, 0.14);
      --green: #2EC4B6;
      --green-soft: rgba(46, 196, 182, 0.14);
      --blue: #3A86FF;
      --blue-soft: rgba(58, 134, 255, 0.14);
      --purple: #9B5DE5;
      --purple-soft: rgba(155, 93, 229, 0.14);
      --kinto-gold: #FFD000;
      --kinto-dark: #1A1100;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-top: calc(var(--safe-top) + 56px);
      padding-bottom: calc(var(--safe-bottom) + 84px);
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: rgba(10, 10, 12, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--safe-top) + 8px) 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .back-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .back-btn.visible {
      display: inline-flex;
    }

    h1 {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    h1 span {
      color: var(--kinto-gold);
    }

    .backup-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .backup-btn:active {
      transform: scale(0.96);
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    .home-intro {
      margin-bottom: 18px;
      text-align: center;
    }

    .home-intro p {
      font-size: 13px;
      color: var(--kinto-gold);
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    /* Nuvola Speedy Compatta + 7 Sfere del Drago */
    .chapters-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-top: 10px;
      padding-bottom: 12px;
    }

    .kinto-cloud {
      position: relative;
      background: linear-gradient(180deg, #FFE853 0%, #FFB703 72%, #FB8500 100%);
      border-radius: 36px;
      padding: 14px 16px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      box-shadow:
        0 6px 18px rgba(255, 183, 3, 0.25),
        inset 0 3px 8px rgba(255, 255, 255, 0.72),
        inset 0 -3px 8px rgba(217, 107, 0, 0.42);
      border: 2px solid #FFF07C;
      transition: transform 0.12s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.12s ease;
    }

    /* Gobbe morbide superiori */
    .kinto-cloud::before {
      content: "";
      position: absolute;
      top: -12px;
      left: 22px;
      width: 50px;
      height: 22px;
      background: linear-gradient(180deg, #FFF07C 0%, #FFE442 100%);
      border-radius: 40px 40px 0 0;
      border-top: 2px solid #FFF6A8;
      border-left: 2px solid #FFF6A8;
      pointer-events: none;
    }

    .kinto-cloud::after {
      content: "";
      position: absolute;
      top: -16px;
      left: 64px;
      width: 64px;
      height: 28px;
      background: linear-gradient(180deg, #FFF38A 0%, #FFE033 100%);
      border-radius: 40px 40px 0 0;
      border-top: 2px solid #FFF8B8;
      border-right: 2px solid #FFF6A8;
      pointer-events: none;
    }

    /* Codina discreta a destra */
    .kinto-tail {
      position: absolute;
      right: -5px;
      bottom: 9px;
      width: 16px;
      height: 10px;
      background: #FFB703;
      border-radius: 16px;
      box-shadow: 7px -4px 0 -1px #FFD000;
      pointer-events: none;
      opacity: 0.92;
    }

    .kinto-cloud:active {
      transform: scale(0.965);
      box-shadow:
        0 3px 10px rgba(255, 183, 3, 0.35),
        inset 0 2px 6px rgba(255, 255, 255, 0.5);
    }

    .chapter-left {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 2;
      min-width: 0;
    }

    /* Sfera del Drago 1-7 stelle */
    .dragon-ball {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #FFF3B0 0%, #FF9F1C 38%, #E85D04 82%, #9D0208 100%);
      border: 2px solid #FFF3B0;
      box-shadow:
        0 3px 8px rgba(130, 30, 0, 0.45),
        inset 0 2px 5px rgba(255, 255, 255, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }

    .dragon-ball svg {
      width: 34px;
      height: 34px;
      display: block;
    }

    .chapter-info {
      min-width: 0;
    }

    .chapter-num {
      font-size: 9.5px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #7A2200;
      margin-bottom: 1px;
    }

    .chapter-title {
      font-size: 16.5px;
      font-weight: 900;
      color: var(--kinto-dark);
      line-height: 1.15;
      margin-bottom: 2px;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .chapter-desc {
      font-size: 12px;
      font-weight: 600;
      color: #422600;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .chapter-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    .chapter-count {
      font-size: 11.5px;
      font-weight: 900;
      padding: 3px 9px;
      border-radius: 20px;
      background: var(--kinto-dark);
      color: var(--kinto-gold);
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .chapter-arrow {
      font-size: 19px;
      color: #5C1D00;
      font-weight: 900;
    }

    /* Section Header & Controls */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }

    .section-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .primary-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(255, 77, 45, 0.3);
    }

    .primary-btn:active {
      transform: scale(0.97);
    }

    .search-box {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--kinto-gold);
    }

    .filter-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .filter-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip.active {
      background: var(--amber-soft);
      border-color: var(--kinto-gold);
      color: var(--kinto-gold);
    }

    /* 6 Distretti Muscolari con Personaggi & Avatar */
    .muscle-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .muscle-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 124px;
      position: relative;
      overflow: hidden;
      transition: transform 0.12s ease;
    }

    .muscle-card:active {
      background: var(--surface-2);
      transform: scale(0.98);
    }

    .muscle-card-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
    }

    .muscle-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .muscle-title {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .char-badge {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .char-avatar-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1.5px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }

    .char-avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .char-avatar-hint {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.1;
      padding: 2px;
    }

    .muscle-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .muscle-count {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .avatar-edit-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--kinto-gold);
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 7px;
      cursor: pointer;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px;
      cursor: pointer;
    }

    .item-card:active {
      background: var(--surface-2);
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .item-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    .badge.amber { background: var(--amber-soft); color: var(--amber); }
    .badge.green { background: var(--green-soft); color: var(--green); }
    .badge.blue { background: var(--blue-soft); color: var(--blue); }
    .badge.purple { background: var(--purple-soft); color: var(--purple); }

    .item-meta {
      font-size: 13px;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .detail-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .media-frame {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #050507;
      border: 1px solid var(--border);
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 150px;
    }

    .media-frame img {
      width: 100%;
      max-height: 290px;
      object-fit: contain;
      display: block;
    }

    .anatomy-placeholder {
      padding: 18px;
      text-align: center;
      width: 100%;
      color: var(--text-muted);
      font-size: 13px;
    }

    .field-block {
      margin-bottom: 13px;
      padding-bottom: 11px;
      border-bottom: 1px solid var(--border);
    }

    .field-block:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .field-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--kinto-gold);
      margin-bottom: 5px;
      display: block;
    }

    .field-label.amber { color: var(--amber); }
    .field-label.green { color: var(--green); }
    .field-label.blue { color: var(--blue); }
    .field-label.purple { color: var(--purple); }

    .field-value {
      font-size: 14px;
      color: var(--text);
      white-space: pre-line;
    }

    .step-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .step-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: var(--surface-2);
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .step-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--kinto-gold);
      color: var(--kinto-dark);
      font-size: 12px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .step-text {
      font-size: 14px;
      color: var(--text);
    }

    .detail-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .secondary-btn {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .danger-btn {
      background: rgba(255, 59, 48, 0.14);
      border: 1px solid rgba(255, 59, 48, 0.4);
      color: #FF453A;
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .alpha-group {
      margin-bottom: 18px;
    }

    .alpha-letter {
      font-size: 14px;
      font-weight: 900;
      color: var(--kinto-dark);
      background: var(--kinto-gold);
      display: inline-block;
      padding: 2px 10px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    /* Bottom Navigation Bar (4 accessi rapidi per uso comodo su iPhone) */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: rgba(14, 14, 18, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 8px 4px calc(var(--safe-bottom) + 6px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
    }

    .nav-item.active {
      color: var(--kinto-gold);
    }

    .nav-item svg {
      width: 21px;
      height: 21px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.84);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 22px 22px 0 0;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 18px 16px calc(var(--safe-bottom) + 20px);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 17px;
      font-weight: 800;
    }

    .close-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 13px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--kinto-gold);
    }

    .form-group textarea {
      min-height: 76px;
      resize: vertical;
    }

    .paste-box {
      width: 100%;
      min-height: 96px;
      background: var(--bg);
      border: 2px dashed var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      outline: none;
      position: relative;
    }

    .paste-box:focus {
      border-color: var(--kinto-gold);
    }

    .paste-box img {
      max-height: 110px;
      object-fit: contain;
      border-radius: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
      font-size: 14px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 16px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button id="backBtn" class="back-btn" onclick="goBack()">‹ Indietro</button>
      <h1 id="headerTitle">MANUALE <span>SALA</span></h1>
    </div>
    <button class="backup-btn" onclick="openBackupModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Backup
    </button>
  </header>

  <main id="appContent"></main>

  <nav>
    <button class="nav-item active" data-tab="home" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Home
    </button>
    <button class="nav-item" data-tab="exercises" onclick="switchTab('exercises')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

    // Genera l'SVG delle stelle dentro ciascuna Sfera del Drago (1..7)
    function renderDragonBallSvg(stars) {
      const coords = {
        1: [[50, 50]],
        2: [[36, 50], [64, 50]],
        3: [[50, 32], [35, 62], [65, 62]],
        4: [[36, 36], [64, 36], [36, 64], [64, 64]],
        5: [[50, 28], [31, 44], [69, 44], [38, 68], [62, 68]],
        6: [[50, 26], [31, 40], [69, 40], [31, 62], [69, 62], [50, 74]],
        7: [[50, 26], [31, 40], [69, 40], [50, 50], [31, 62], [69, 62], [50, 74]]
      };
      const pts = coords[stars] || coords[1];
      const r = stars >= 5 ? 7.2 : 8.5;

      const starShapes = pts.map(([cx, cy]) => {
        const starPoints = [];
        for (let i = 0; i < 10; i++) {
          const angle = (Math.PI / 5) * i - Math.PI / 2;
          const rad = i % 2 === 0 ? r : r * 0.42;
          starPoints.push(`${(cx + rad * Math.cos(angle)).toFixed(1)},${(cy + rad * Math.sin(angle)).toFixed(1)}`);
        }
        return `<polygon points="${starPoints.join(' ')}" fill="#C1121F" />`;
      }).join('');

      return `<svg viewBox="0 0 100 100" aria-hidden="true">${starShapes}</svg>`;
    }

    function switchTab(tab) {
      state.tab = tab;
      state.selectedMuscle = null;
      state.selectedExerciseId = null;
      state.equipmentFilter = 'Tutti';
      state.searchQuery = '';
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      render();
      window.scrollTo(0, 0);
    }

    function goBack() {
      if (state.tab === 'exercises') {
        if (state.selectedExerciseId) {
          state.selectedExerciseId = null;
        } else if (state.selectedMuscle) {
          state.selectedMuscle = null;
          state.equipmentFilter = 'Tutti';
          state.searchQuery = '';
        } else {
          switchTab('home');
          return;
        }
      } else if (state.tab !== 'home') {
        switchTab('home');
        return;
      }
      render();
    }

    function render() {
      const container = document.getElementById('appContent');
      const backBtn = document.getElementById('backBtn');
      const headerTitle = document.getElementById('headerTitle');

      const hasBack = state.tab !== 'home';
      backBtn.classList.toggle('visible', hasBack);

        backBtn.textContent = '‹ Home';

        backBtn.textContent = '‹ Indietro';

      if (state.tab === 'home') {
        headerTitle.innerHTML = 'MANUALE <span>SALA</span>';
        renderHome(container);
      } else if (state.tab === 'exercises') {
        if (state.selectedExerciseId) {
          headerTitle.innerHTML = 'SCHEDA <span>ESERCIZIO</span>';

    function renderVocabulary(container) {
      const q = state.searchQuery.toLowerCase();
      const sorted = [...state.data.vocabulary]
        .filter(v => !q || v.term.toLowerCase().includes(q) || v.definition.toLowerCase().includes(q))
        .sort((a, b) => a.term.localeCompare(b.term, 'it', { sensitivity: 'base' }));

      const groups = {};
      sorted.forEach(item => {
        const letter = (item.term.trim()[0] || '#').toUpperCase();
        if (!groups[letter]) groups[letter] = [];
        groups[letter].push(item);
      });

      let html = `
        <div class="section-header">
          <span class="section-subtitle">${sorted.length} termini in ordine alfabetico</span>
          <button class="primary-btn" onclick="openVocabForm()">+ Termine</button>
        </div>
        <input class="search-box" type="search" placeholder="Cerca termine nel vocabolario..." value="${escapeHtml(state.searchQuery)}" oninput="updateSearch(this.value)" />
      `;

      if (sorted.length === 0) {
        html += `<div class="empty-state">Nessun termine trovato.<br>Tocca <strong>+ Termine</strong> per aggiungere una definizione.</div>`;
      } else {
        Object.keys(groups).sort((a, b) => a.localeCompare(b, 'it')).forEach(letter => {
          html += `<div class="alpha-group"><div class="alpha-letter">${letter}</div><div class="card-list">`;
          groups[letter].forEach(item => {
            html += `
              <div class="item-card" style="cursor:default;">
                <div class="item-top">
                  <div class="item-title">${escapeHtml(item.term)}</div>
                  <div style="display:flex; gap:6px;">

            `;
          });
          html += `</div></div>`;
        });
      }

      container.innerHTML = html;
    }

    /* Gestione generica Incolla Immagine (Ctrl + V / Tap) */
    function handleGenericPaste(e, inputId, boxId) {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          const blob = items[i].getAsFile();
          const reader = new FileReader();
          reader.onload = function(evt) {
            const base64 = evt.target.result;
            document.getElementById(inputId).value = base64;
            document.getElementById(boxId).innerHTML = `<img src="${base64}" alt="Incollata" />`;
          };
          reader.readAsDataURL(blob);
          e.preventDefault();
          break;
        }
      }
    }

    function clearGenericPaste(inputId, boxId, labelHint = "l'immagine") {
      document.getElementById(inputId).value = '';
      document.getElementById(boxId).innerHTML = `<span style="font-size:12px; color:var(--text-muted);">Clicca qui e premi <strong>Ctrl + V</strong> per incollare ${escapeHtml(labelHint)}</span>`;
    }

    function deleteItem(collection, id) {
      if (!confirm('Vuoi eliminare definitivamente questo elemento?')) return;
      state.data[collection] = state.data[collection].filter(item => item.id !== id);
      if (collection === 'exercises' && state.selectedExerciseId === id) {
        state.selectedExerciseId = null;
      }
      saveData();
      render();
    }

    function openModal(id) {
      document.getElementById(id).classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    function openBackupModal() {
      openModal('backupModal');
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const date = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `manuale-sala-pesi-${date}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.exercises && imported.vocabulary) {
            state.data = {
              characterAvatars: imported.characterAvatars || DEFAULT_DATA.characterAvatars,
              exercises: imported.exercises || [],
              intensity: imported.intensity || [],
              specializations: imported.specializations || [],
              hormones: imported.hormones || DEFAULT_DATA.hormones,
              supplements: imported.supplements || DEFAULT_DATA.supplements,
              deepDives: imported.deepDives || DEFAULT_DATA.deepDives,
              vocabulary: imported.vocabulary || []
            };
            saveData();
            closeModal('backupModal');
            render();
            alert('Backup importato con successo!');
          } else {
            alert('File non valido.');
          }
        } catch (err) {
          alert('Errore durante la lettura del file.');
        }
      };
      reader.readAsText(file);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    render();
  </script>
